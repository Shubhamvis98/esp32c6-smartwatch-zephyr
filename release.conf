# Release build: ./build.sh -p release  (adds this file on top of prj.conf)
#
# Leaves out the UART shell and its test commands (src/port/shell_cmds.c),
# saving ~9 KB of RAM (stack, context, history and command buffers).
# Errors and warnings still go to the UART.
CONFIG_SHELL=n
CONFIG_INIT_STACKS=n
CONFIG_THREAD_ANALYZER=n
CONFIG_LOG_DEFAULT_LEVEL=2
# The RAM the shell used goes to the shared kernel heap (prj.conf: 180 KB)
CONFIG_HEAP_MEM_POOL_SIZE=196608
