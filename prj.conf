# Smartwatch for the Waveshare ESP32-C6-Touch-LCD-1.69 (Zephyr)

# ---- Display / LVGL ----
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_HEAP_LIB_C=y
# One 10 % draw buffer (13 KB).  Double buffering let LVGL render the next
# strip while the previous one went out over SPI, but cost another 13 KB plus
# a flush thread; a strip takes ~2 ms to send, so the gain was small.
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_FLUSH_THREAD=n
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_DEF_REFR_PERIOD=16
CONFIG_LV_USE_LOG=n
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_GRID=y
CONFIG_LV_USE_OBSERVER=y
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_DROPDOWN=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SPINNER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_TILEVIEW=y
CONFIG_LV_USE_FONT_PLACEHOLDER=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# ---- Board peripherals (touch, IMU, RTC and codec are driven by the app over I2C) ----
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_INPUT=n
CONFIG_SENSOR=n
CONFIG_RTC=n

# ---- Storage: settings (NVS) and LittleFS at /data ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=64
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=64

# ---- libc / time ----
CONFIG_PICOLIBC=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_RING_BUFFER=y
CONFIG_EVENTS=y

# ---- kernel ----
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# One heap for the app, LVGL, Wi-Fi and Bluetooth (compat/heap_wrap.c)
CONFIG_HEAP_MEM_POOL_SIZE=184320
CONFIG_THREAD_NAME=y
CONFIG_TIMESLICING=y

# ---- console / shell ----
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_SHELL_CMD_BUFF_SIZE=1024
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FS_LOG_LEVEL_OFF=y
# printk straight to the console (not through the shell's log backend)
CONFIG_LOG_PRINTK=n
CONFIG_I2S=y
CONFIG_I2S_LOG_LEVEL_WRN=y

# Networking / Wi-Fi
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=4
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_LOG=y
CONFIG_ENTROPY_GENERATOR=y

# Wireless updates (MCUboot slots)
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_FLASH_PAGE_LAYOUT=y
# Loopback interface, used by "watch http" to test the web server on the watch
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Bluetooth LE: Gadgetbridge (Nordic UART), HID keyboard/mouse, media keys
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="C6 Watch"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_DEVICE_APPEARANCE_DYNAMIC=y
CONFIG_BT_ID_MAX=2
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_BAS=y
CONFIG_BT_L2CAP_TX_MTU=185
CONFIG_BT_BUF_ACL_RX_SIZE=189
CONFIG_BT_BUF_ACL_TX_SIZE=189
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_ESP32_SW_COEXIST_ENABLE=y
# Fewer Wi-Fi driver buffers (allocated from the heap at start-up)
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=12
